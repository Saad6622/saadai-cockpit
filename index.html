<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaadAi</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<noscript><meta http-equiv="refresh" content="0; url=https://792e8608e32186.lhr.life/home"></noscript>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#020617;color:#f8fafc;margin:0}
main{text-align:center;padding:2rem;max-width:30rem}
.spinner{width:2.6rem;height:2.6rem;border:3px solid #334155;border-top-color:#f5a524;border-radius:50%;margin:0 auto 1.2rem;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:1.35rem;font-weight:600;margin:0 0 .5rem}
p{line-height:1.5}
.small{color:#b9c3da;font-size:.9rem}
a{color:#f5a524}
button{font-family:inherit;background:#f5a524;border:0;color:#020617;font-size:1rem;font-weight:600;padding:.65rem 1.5rem;border-radius:.55rem;cursor:pointer;margin:.6rem 0}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
<div class="spinner" role="status" aria-label="Loading"></div>
<h1 id="headline">Connecting to your cockpit…</h1>
<p id="detail" class="small">Finding the fastest route — this usually takes a few seconds.</p>
<p><button id="retry" type="button">Try again now</button></p>
<p class="small">If this keeps spinning, you can <a id="direct" href="https://792e8608e32186.lhr.life/home">open the cockpit directly</a>.</p>
<p class="small" id="gap-note">Seeing the tunnel provider's "no tunnel here" page instead? Come back here and tap "Try again now" — it tries the next live link.</p>
</main>
<script>
(function(){
var FALLBACK="https://792e8608e32186.lhr.life/home";
var headline=document.getElementById('headline');
var detail=document.getElementById('detail');
var direct=document.getElementById('direct');
var retry=document.getElementById('retry');
// Pool-aware loader (2026-10-29): status.json carries every live tunnel.
// Each visit (or retry tap) tries the NEXT member, so a dead member costs
// one tap, never a wait for a rebuild — the next member was already live.
var idx=0;
try{idx=parseInt(sessionStorage.getItem('saadai_pool_idx')||'0',10)||0;}catch(e){idx=0;}
function say(h,d){headline.textContent=h;detail.textContent=d;}
function load(){
  fetch('status.json?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok){throw 0;}return r.json();})
    .then(function(s){
      var pool=(s&&s.pool&&s.pool.length)?s.pool:[(s&&s.url)?s.url:FALLBACK];
      var target=pool[idx%pool.length];
      direct.href=target;
      try{sessionStorage.setItem('saadai_pool_idx',String((idx+1)%pool.length));}catch(e){}
      say('Connected.','Opening your cockpit now.');
      window.location.replace(target);
    })
    .catch(function(){
      say('The tunnel is rotating — retry in a moment.',
          'The cockpit link is refreshing. This page retries on its own — or tap "Try again now" below.');
      setTimeout(load,30000);
    });
}
retry.addEventListener('click',function(){load();});
load();
})();
</script>
</body>
</html>
